plugins {
    id 'com.android.application'
}

android {
    namespace 'za.ac.richfield.smartpantry'
    compileSdk 34

    defaultConfig {
        applicationId "za.ac.richfield.smartpantry"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.8.2'

    // OkHttp for the REST calls, Gson for JSON. Both are small, widely used and
    // straightforward to explain, which matters for a module assessing fundamentals.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Unit tests for the strict-matching logic. These run on the JVM with
    // ./gradlew test - no emulator needed.
    testImplementation 'junit:junit:4.13.2'
}
